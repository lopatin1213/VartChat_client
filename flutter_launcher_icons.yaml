flutter_launcher_icons:
  # Общий путь для всех платформ (если иконка одна)
  image_path: "assets/icon/icon.png"

  # --- Android ---
  android: true
  min_sdk_android: 21
  # Адаптивная иконка (Android 8+). Раскомментируй, если есть отдельные файлы
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/foreground.png"
  # adaptive_icon_monochrome: "assets/icon/monochrome.png"

  # --- iOS ---
  ios: true
  remove_alpha_ios: true

  # --- Web ---
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1A1A2E"
    theme_color: "#1A1A2E"

  # --- Windows ---
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48

  # --- macOS ---
  macos:
    generate: true
    image_path: "assets/icon/icon.png"